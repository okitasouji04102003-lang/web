<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="container-letter">
      <div class="cover"></div>
      <span class="heart">♥</span>
      <p class="paper" id="mainMessage">
        A veces no sé cómo decirlo, pero me haces sentir muy bien cada vez que hablamos 💛 Me encanta tenerte cerca, aunque sea en mensajes, y espero que hoy tengas un día tan especial como tú 😊 
      </p>
      <div class="letter"></div>
    </div>
    <div class="options">
      <button id="open">Abrir</button>
      <button id="close">Cerrar</button>
      <a href="SAN VALENTIN.pdf" download>
        <button id="download">Mensajito adicional</button>
      </a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
